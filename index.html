<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Đảo Tiếng Anh">
<meta name="theme-color" content="#19a7c9">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Đảo Tiếng Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE   children's game: sunny, bouncy, always encouraging
   IDEA    a treasure map of a tropical archipelago; each island is one topic from the grade 3 book
   PICTURE the sea map with drawn islands on a dotted route, and Cú Tô the owl who grows as stars come in
   COLOUR  sea turquoise ground, sand yellow, leaf green; coral for actions, sun gold for stars; one colour per skill
   TYPE    Baloo 2 for titles and answers + Nunito for text, both with Vietnamese marks
   LAYOUT  one-screen app: slim top bar, the screen fills the rest; map winds left-right in landscape, top-down in portrait */
:root{color-scheme:light;--sea:#19a7c9;--sand:#ffd27a;--sand2:#efae47;--leaf:#38b75a;--ink:#0d2b3e;--mute:#4f6b7c;--coral:#ff5a4e;--coral2:#d63c2e;--sun:#ffc21a;--ok:#1fa860;--L:#2f6fed;--S:#ff7a3d;--R:#1fa860;--W:#8e5bdc;--disp:"Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;--text:"Nunito",ui-rounded,system-ui,sans-serif}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--sea);color:var(--ink);font:600 17px/1.45 var(--text);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
svg{display:block}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.app.quiz .top{display:none}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:8px max(16px,2vw);color:#fff;background:#1196bb}
.who{flex:1;display:flex;align-items:center;gap:10px;text-align:left}
.who .owl{width:44px;height:48px;flex:none}
.who h1{margin:0;font:800 clamp(22px,3vw,28px)/1.05 var(--disp)}
.who .hi{display:block;font-size:14px;opacity:.92}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.2);color:#fff;font:800 18px var(--disp);white-space:nowrap}
.pill svg{width:22px;height:22px}
.pill.on{background:#fff;color:var(--ink)}
.pill.on svg{color:var(--sun)}
.iconbtn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;color:#fff;flex:none}
.iconbtn svg{width:24px;height:24px}
.stage{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.screen.show{display:block}
#s-map{overflow:hidden}
.mapbox{position:absolute;inset:0}
.sea{position:absolute;inset:0;width:100%;height:100%}
.isle{position:absolute;width:var(--iw);transform:translate(-50%,-40%);display:flex;flex-direction:column;align-items:center;text-align:center}
.isle .art{position:relative;width:100%;aspect-ratio:200/130;display:block}
.isle .art svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.isle .badge{position:absolute;left:45%;top:42%;transform:translate(-50%,-50%);font-size:calc(var(--iw)*.25);line-height:1}
.isle .lk{position:absolute;left:45%;top:42%;transform:translate(-50%,-50%);width:calc(var(--iw)*.28);height:calc(var(--iw)*.28);border-radius:50%;background:rgba(13,43,62,.78);color:#fff;display:grid;place-items:center}
.isle .lk svg{width:55%;height:55%}
.isle.lock .badge{opacity:.3}
.isle.lock .art svg{opacity:.62;filter:saturate(.35)}
.isle .nm{margin-top:-6px;background:#fff;color:var(--ink);border-radius:14px;padding:3px 12px 4px;font:800 clamp(15px,1.7vw,19px)/1.1 var(--disp);box-shadow:0 4px 0 rgba(13,43,62,.22);white-space:nowrap}
.isle .nm small{display:block;font:700 12.5px/1.25 var(--text);color:var(--mute)}
.isle .st{margin-top:6px;display:inline-flex;align-items:center;gap:4px;background:rgba(13,43,62,.55);color:#fff;border-radius:99px;padding:1px 10px;font:800 14px/1.5 var(--disp);white-space:nowrap}
.isle .st svg{width:15px;height:15px;color:var(--sun)}
.isle.next .art{animation:bob 2.2s ease-in-out infinite}
.isle:active .art{transform:scale(.95)}
.wrap{max-width:1100px;margin:0 auto;padding:10px max(16px,2.5vw) 28px}
.hdr{display:flex;align-items:center;gap:14px;color:#fff;margin:4px 0 18px}
.hdr .ie{font-size:clamp(44px,7vmin,64px);line-height:1}
.hdr h2{margin:0;font:800 clamp(30px,4.6vmin,46px)/1.05 var(--disp);letter-spacing:-.02em}
.hdr h2 small{display:block;font:700 clamp(16px,2.2vmin,20px)/1.3 var(--text);opacity:.92;letter-spacing:0}
.round{width:52px;height:52px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;flex:none;box-shadow:0 4px 0 rgba(13,43,62,.22)}
.round svg{width:26px;height:26px}
.tiles4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,2vw,20px)}
.learnb{grid-column:1/-1;display:flex;align-items:center;gap:16px;background:#fff;border-radius:24px;padding:14px 20px;text-align:left;box-shadow:0 6px 0 rgba(13,43,62,.2);min-height:88px}
.learnb>svg{width:46px;height:46px;color:var(--coral);flex:none}
.learnb b{display:block;font:800 26px/1.1 var(--disp)}
.learnb small{color:var(--mute);font-size:15px}
.learnb .mini{margin-left:auto;font-size:34px;line-height:1;display:flex;gap:8px;align-items:center}
.learnb .mini .sw{font-size:30px}
.sk{border-radius:26px;color:#fff;padding:18px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:clamp(170px,28vmin,250px)}
.sk>svg{width:clamp(48px,8vmin,70px);height:clamp(48px,8vmin,70px)}
.sk b{font:800 clamp(30px,4.6vmin,42px)/1 var(--disp);margin-top:8px}
.sk small{font-size:15px;opacity:.92}
.skL{background:var(--L);box-shadow:0 8px 0 #1d4fb8}
.skS{background:var(--S);box-shadow:0 8px 0 #c95522}
.skR{background:var(--R);box-shadow:0 8px 0 #12783f}
.skW{background:var(--W);box-shadow:0 8px 0 #643aa8}
.sk:active,.learnb:active,.opt:active,.tile:active,.go:active,.btn2:active,.wc:active{transform:translateY(3px)}
.stars{display:flex;gap:3px;margin-top:8px}
.stars svg{width:28px;height:28px;color:rgba(255,255,255,.38)}
.stars svg.on{color:var(--sun)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.wc{background:#fff;border-radius:22px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 rgba(13,43,62,.18)}
.wc .emo,.wc .sw{font-size:64px;line-height:1.15}
.wc b{font:800 26px/1.1 var(--disp)}
.wc small{color:var(--mute);font-size:15px}
.wc.play{outline:4px solid var(--sun)}
.emo{line-height:1}
.sw{display:inline-block;width:1em;height:1em;border-radius:50%;background:var(--c);border:.05em solid rgba(13,43,62,.14);box-shadow:inset 0 -.09em 0 rgba(0,0,0,.16),inset .06em .08em 0 rgba(255,255,255,.4)}
.qwrap{height:100%;display:flex;flex-direction:column;padding:10px max(16px,2vw) 14px}
.qhead{display:flex;align-items:center;gap:12px;flex:none}
.dots{flex:1;display:flex;gap:8px;justify-content:center}
.dots i{width:clamp(26px,6vw,56px);height:12px;border-radius:99px;background:rgba(255,255,255,.35)}
.dots i.d{background:var(--sun)}
.dots i.c{background:#fff}
.chip2{display:inline-flex;align-items:center;gap:6px;color:#fff;border-radius:99px;padding:0 14px;min-height:40px;font:800 18px var(--disp);white-space:nowrap}
.chip2 svg{width:22px;height:22px}
.cL{background:var(--L)}.cS{background:var(--S)}.cR{background:var(--R)}.cW{background:var(--W)}
.qcard{flex:1;background:#fff;border-radius:28px;margin-top:12px;display:flex;flex-direction:column;padding:clamp(14px,2.4vw,28px);box-shadow:0 8px 0 rgba(13,43,62,.16);overflow:auto}
.instr{display:flex;align-items:center;gap:10px;font:800 clamp(19px,2.4vmin,25px)/1.2 var(--disp);flex:none}
.sbtn{width:44px;height:44px;border-radius:50%;background:#e9f6fa;color:var(--L);display:grid;place-items:center;flex:none}
.sbtn svg{width:24px;height:24px}
.sbtn.big{width:60px;height:60px;background:var(--L);color:#fff;box-shadow:0 4px 0 #1d4fb8}
.sbtn.big svg{width:32px;height:32px}
.qbody{flex:1;display:grid;gap:clamp(14px,2.6vw,32px);align-content:center;padding:14px 0 4px}
.prompt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.prompt.row{flex-direction:row;flex-wrap:wrap}
.bigpic{font-size:clamp(96px,17vmin,170px);line-height:1}
.bigpic.md{font-size:clamp(80px,13vmin,130px)}
.word{font:800 clamp(44px,8vmin,76px)/1.05 var(--disp);letter-spacing:.01em}
.word .bl{display:inline-block;min-width:.7em;border-bottom:.08em solid var(--W);color:var(--W)}
.word .bl.okc{color:var(--ok);border-color:var(--ok)}
.sent{font:800 clamp(28px,4.6vmin,46px)/1.15 var(--disp);text-wrap:balance}
.sent.sm{font-size:clamp(24px,3.6vmin,36px)}
.qline{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
.speak{width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);border-radius:50%;background:var(--L);color:#fff;display:grid;place-items:center;box-shadow:0 8px 0 #1d4fb8}
.speak svg{width:52%;height:52%}
.hint{margin:0;color:var(--mute);font-size:15px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.8vw,18px)}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{background:#f2fafc;border:3px solid #d3edf3;border-radius:22px;min-height:clamp(108px,21vmin,200px);display:grid;place-items:center;font-size:clamp(60px,12vmin,110px);line-height:1;box-shadow:0 6px 0 #c2e2ea}
.opt.txt{font:800 clamp(28px,5vmin,42px)/1.1 var(--disp);color:var(--ink)}
.opt small{display:block;font:700 15px var(--text);color:var(--mute)}
.opt.good{background:#dcf6e7;border-color:var(--ok);box-shadow:0 6px 0 #138a4b}
.opt.bad{opacity:.3;animation:shake .4s}
.opt.hintc{border-color:var(--sun);animation:pulse 1s ease-in-out infinite}
.say{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.mic{width:clamp(124px,20vmin,170px);height:clamp(124px,20vmin,170px);border-radius:50%;background:var(--S);color:#fff;display:grid;place-items:center;box-shadow:0 8px 0 #c95522}
.mic svg{width:50%;height:50%}
.mic.live{animation:ring 1.1s ease-out infinite}
.heard{font:800 20px/1.3 var(--disp);color:var(--mute);min-height:1.3em}
.heard.okc{color:var(--ok)}
.judge{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.judge button{min-height:64px;padding:0 22px;border-radius:18px;font:800 22px var(--disp);display:inline-flex;align-items:center;gap:8px}
.judge svg{width:26px;height:26px}
.yes{background:var(--ok);color:#fff;box-shadow:0 5px 0 #138a4b}
.again{background:#eef3f6;color:var(--ink);box-shadow:0 5px 0 #cdd9e0}
.small{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:14px;background:#e9f6fa;color:var(--L);font-weight:800}
.small svg{width:20px;height:20px}
.peek{min-height:44px;color:var(--mute);font-size:15px;text-decoration:underline}
.ans{font:800 26px var(--disp);color:var(--S)}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.slot{width:clamp(36px,6.4vmin,60px);height:clamp(48px,8vmin,72px);border-radius:12px 12px 4px 4px;background:#f2fafc;border-bottom:5px solid #b6d9e2;display:grid;place-items:center;font:800 clamp(28px,5vmin,44px)/1 var(--disp);color:var(--W)}
.slot.gap{width:16px;background:none;border:0}
.slot.okc{color:var(--ok);border-color:var(--ok)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.tile{min-width:clamp(54px,8.6vmin,76px);height:clamp(54px,8.6vmin,76px);padding:0 12px;border-radius:16px;background:var(--W);color:#fff;font:800 clamp(28px,5vmin,40px)/1 var(--disp);box-shadow:0 5px 0 #643aa8}
.tile.wd{font-size:clamp(22px,3.8vmin,32px)}
.tile.used{visibility:hidden}
.line{min-height:clamp(64px,10vmin,88px);width:100%;border-bottom:4px dashed #b6d9e2;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding-bottom:8px}
.line .tile{background:#f1eafc;color:var(--W);box-shadow:0 4px 0 #d9c9f3}
.line.okc .tile{background:#dcf6e7;color:#127a42;box-shadow:0 4px 0 #a8e2c1}
.ph{color:#9db3bf;font-size:16px}
.shake{animation:shake .45s}
.fb{display:none;align-items:center;gap:14px;margin-top:14px;padding:10px 14px;border-radius:22px;background:#e3f7ec;flex:none}
.fb.show{display:flex}
.fb .owl{width:60px;height:66px;flex:none}
.fb b{flex:1;font:800 clamp(22px,3.4vmin,28px)/1.15 var(--disp);color:#11713d}
.fb b small{display:block;font:700 17px/1.3 var(--text);color:var(--ink)}
.go{min-height:58px;padding:0 26px;border-radius:18px;background:var(--coral);color:#fff;font:800 22px var(--disp);box-shadow:0 5px 0 var(--coral2);white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.btn2{min-height:58px;padding:0 22px;border-radius:18px;background:#eef3f6;font:800 20px var(--disp);box-shadow:0 5px 0 #cdd9e0;display:inline-flex;align-items:center;gap:8px}
.btn2 svg,.go svg{width:22px;height:22px}
.done{min-height:100%;display:grid;place-items:center;padding:20px}
.dcard{background:#fff;border-radius:32px;padding:clamp(20px,4vw,40px);text-align:center;max-width:580px;width:100%;box-shadow:0 10px 0 rgba(13,43,62,.18)}
.dcard .owl{width:clamp(110px,20vmin,170px);height:auto;margin:0 auto}
.bigstars{display:flex;justify-content:center;gap:10px;margin-top:6px}
.bigstars svg{width:clamp(58px,10vmin,86px);height:clamp(58px,10vmin,86px);color:#e2ecf0}
.bigstars svg.on{color:var(--sun);animation:pop .5s backwards}
.dcard h2{font:800 clamp(32px,5vmin,46px)/1.1 var(--disp);margin:10px 0 4px}
.dcard p{margin:4px 0}
.newst{margin-top:12px;background:#fff4cf;border-radius:18px;padding:8px 14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}
.newst span{font-size:40px;line-height:1}
.dbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.me{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:20px;align-items:start}
.mecard,.stk,.pc{background:#fff;border-radius:28px;padding:20px 22px}
.mecard{text-align:center}
.mecard .owl{width:min(230px,62%);height:auto;margin:0 auto}
.mecard h3,.stk h3,.pc h3{margin:6px 0 8px;font:800 24px/1.2 var(--disp)}
.mute{color:var(--mute);margin:0 0 12px;font-size:15px}
.bar{height:16px;border-radius:99px;background:#e5f1f5;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.bigsum{display:flex;align-items:center;justify-content:center;gap:8px;font:800 26px var(--disp);margin:14px 0 0}
.bigsum svg{width:30px;height:30px;color:var(--sun)}
.sgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.sgrid span{aspect-ratio:1;border-radius:16px;background:#f1f7f9;display:grid;place-items:center;font-size:clamp(26px,4.4vmin,40px);line-height:1}
.sgrid span.no{color:#c3d4db;font:800 22px var(--disp)}
.gate{min-height:100%;display:grid;place-items:center;padding:20px}
.gcard{background:#fff;border-radius:28px;padding:28px;text-align:center;max-width:420px;width:100%}
.gcard h3{margin:0;font:800 28px var(--disp)}
.hold{position:relative;width:124px;height:124px;border-radius:50%;background:var(--ink);color:#fff;font:800 20px var(--disp);margin:18px auto;display:grid;place-items:center}
.hold .ring{position:absolute;inset:-8px;width:140px;height:140px;transform:rotate(-90deg)}
.hold circle{fill:none;stroke:var(--sun);stroke-width:8;stroke-linecap:round;stroke-dasharray:402;stroke-dashoffset:402}
.hold.go2 circle{transition:stroke-dashoffset 3s linear;stroke-dashoffset:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.srow{display:grid;grid-template-columns:3.2em minmax(0,1fr) 3.4em;gap:10px;align-items:center;margin:9px 0}
.srow em{font-style:normal;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.pc table{width:100%;border-collapse:collapse;font-size:15px}
.pc th,.pc td{padding:7px 4px;border-bottom:1px solid #e6eef1;text-align:center}
.pc th:first-child,.pc td:first-child{text-align:left}
.pc td.s{color:var(--sun);white-space:nowrap;letter-spacing:-.05em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff0ee;border-radius:999px;padding:6px 12px;font-weight:800}
.chip b{color:var(--coral2)}
.setr{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #eef3f6}
.setr p{margin:0;font-weight:800}
.setr p small{display:block;color:var(--mute);font-weight:600;font-size:14px}
.seg{display:inline-flex;background:#eef3f6;border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:44px;padding:0 14px;border-radius:10px;font-weight:800}
.seg button.on{background:var(--ink);color:#fff}
.txt{font:700 18px var(--text);padding:10px 14px;border-radius:14px;border:2px solid #cde2e9;width:100%;min-height:50px;color:var(--ink);background:#fff}
.danger{min-height:48px;border-radius:14px;padding:0 16px;font-weight:800;color:var(--coral2);border:2px solid #ffd0ca;background:#fff}
.modal{position:fixed;inset:0;background:rgba(6,40,58,.55);display:grid;place-items:center;padding:20px;z-index:10}
.modal[hidden]{display:none}
.mcard{background:#fff;border-radius:28px;padding:24px;max-width:440px;width:100%;text-align:center}
.mcard .owl{width:116px;height:auto;margin:0 auto}
.mcard h3{font:800 28px/1.1 var(--disp);margin:6px 0 8px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;z-index:20;width:max-content;max-width:min(560px,92vw);text-align:center;transition:transform .3s}
.toast.on{transform:translate(-50%,0)}
.cf{position:fixed;top:-20px;width:12px;height:16px;border-radius:3px;z-index:15;animation:fall 2.4s linear forwards}
.wide2{grid-column:span 2;display:flex;align-items:center;gap:14px;border-radius:24px;color:#fff;padding:16px 20px;text-align:left;min-height:96px}
.wide2>svg{width:44px;height:44px;flex:none}
.wide2 b{display:block;font:800 clamp(22px,3vmin,28px)/1.1 var(--disp)}
.wide2 small{display:block;font-size:15px;opacity:.95}
.wide2 .tag{margin-left:auto;background:rgba(255,255,255,.24);border-radius:99px;padding:4px 12px;font-weight:800;white-space:nowrap}
.sg{background:#e64980;box-shadow:0 8px 0 #b13368}

const TTS='speechSynthesis' in window;
let voices=[];const keep=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){}}
if(TTS){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}}
const vlang=v=>(v.lang||'').replace('_','-').toLowerCase();
function voiceFor(l){if(!voices.length)loadVoices();if(l==='vi')return voices.find(v=>vlang(v).startsWith('vi'));const en=voices.filter(v=>vlang(v).startsWith('en'));return en.find(v=>vlang(v)==='en-us'&&/samantha|google us|aaron|nicky|ava|allison/i.test(v.name))||en.find(v=>vlang(v)==='en-us')||en.find(v=>vlang(v)==='en-gb')||en[0]}
const hasVi=()=>!!voiceFor('vi');
function say(text,l='en',o){return new Promise(res=>{if(!TTS||!text)return res();try{
const u=new SpeechSynthesisUtterance(text);const v=voiceFor(l);if(v)u.voice=v;u.lang=l==='vi'?'vi-VN':'en-US';u.rate=o&&o.rate||(l==='vi'?1:S.set.rate);if(o&&o.pitch)u.pitch=o.pitch;
let fin=false;const end=()=>{if(!fin){fin=true;res()}};u.onend=end;u.onerror=end;keep.push(u);if(keep.length>8)keep.shift();
setTimeout(end,Math.min(9000,1500+text.length*110));
if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(()=>speechSynthesis.speak(u),80)}else speechSynthesis.speak(u)}catch(e){res()}})}
let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}return AC}
function tone(fq,t0,d,type,v){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type||'sine';o.frequency.value=fq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.16,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}

g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.015);g.gain.exponentialRampToValueAtTime(.06,t+Math.max(.12,d*.8));g.gain.exponentialRampToValueAtTime(.001,t+d+.3);

function playSeg(sg,kind,from,to,hl,leadBeats){return new Promise(async res=>{ac();const my=songRun,f=S.set.tempo<1?.8:1,name=bufName(sg,kind);let buf;

const norm=s=>s.toLowerCase().replace(/[^a-z' ]+/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];for(let j=1;j<=b.length;j++)d[i][j]=i?Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return d[a.length][b.length]}

if(d.peek!==undefined){const a=$('#ans');if(a)a.hidden=!a.hidden}});

function finish(){if(Q.kind==='song'||Q.kind==='story')return finishCh();const n=Q.score,s3=n>=5?3:n>=3?2:1,lv0=level(),un0=T.map((_,i)=>unlocked(i));let stk=null,isle=null;
if(!Q.review){const id=T[cur].id;S.stars[id]=S.stars[id]||{};const prev=st(id,Q.sk);if(s3>prev)S.stars[id][Q.sk]=s3;if(s3===3&&prev<3){stk=STICK.find(s=>!S.stickers.includes(s));if(stk)S.stickers.push(stk)}}
save();T.forEach((t,i)=>{if(unlocked(i)&&!un0[i])isle=t});const lv1=level();
$('#s-done').innerHTML=`<div class="done"><div class="dcard">${owl(lv1)}<div class="bigstars">${[0,1,2].map(i=>ico.star.replace('<svg',`<svg class="${i<s3?'on':''}" style="animation-delay:${i*.25}s"`)).join('')}</div>
<h2>${s3===3?'Tuyệt vời!':s3===2?'Giỏi lắm!':'Bé cố gắng lắm!'}</h2><p>Bé làm đúng ngay lần đầu ${n}/5 câu${Q.review?` · nhớ lại được ${Q.fixed} từ`:''}.</p>
${stk?`<div class="newst"><span>${stk}</span>Sticker mới cho bộ sưu tập!</div>`:''}${lv1>lv0?`<div class="newst">Cú Tô lên cấp: ${LVN[lv1]}!</div>`:''}${isle?`<div class="newst"><span>${isle.e}</span>Đã mở đảo mới: ${isle.en}!</div>`:''}
<div class="dbtns"><button class="btn2" data-again>${ico.redo}Chơi lại</button><button class="go" data-home>${Q.review?'Về bản đồ':'Về đảo'} ›</button></div></div></div>`;
show('s-done');sfx('win');if(s3===3)confetti();setTimeout(()=>say(s3===3?'Excellent!':'Good job!'),500)}
function finishCh(){const t=T[cur],id=t.id,k=Q.kind,pass=!Q.failed&&Q.pdone&&Q.score>=4,un0=T.map((_,i)=>unlocked(i));let isle=null;
if(pass){S[k][id]=true;save()}T.forEach((x,i)=>{if(unlocked(i)&&!un0[i])isle=x});
const nm=k==='song'?'bài hát':'truyện',auto=Q.score-(Q.pdone?1:0);
const why=pass?`Bé đã thuộc ${nm} “${k==='song'?SONGS[id].title:STORIES[id].title}”.`:!Q.pdone&&auto<3?`Bé đúng ${auto}/4 câu, cần đúng từ 3 câu trở lên. Bé ${k==='song'?'nghe và hát theo thêm':'đọc lại truyện'} rồi thử lại nhé!`:`Bé ${k==='song'?'hát':'kể'} thêm vài lần nữa rồi ${k==='song'?'hát':'kể'} lại cho ba mẹ nghe nhé!`;
const left=S.set.need&&cur<T.length-1&&!isleDone(id)?[[done(id),'xong 4 trạm'],[S.song[id],'thuộc bài hát'],[S.story[id],'thuộc truyện']].filter(x=>!x[0]).map(x=>x[1]):[];
$('#s-done').innerHTML=`<div class="done"><div class="dcard">${owl(level())}<div class="badge2" style="background:${pass?(k==='song'?'#e64980':'#f59f00'):'#b9ccd4'}">${k==='song'?ico.note:ico.book}</div>
<h2>${pass?(k==='song'?'Bé thuộc bài hát rồi!':'Bé thuộc truyện rồi!'):'Chưa đạt rồi'}</h2><p>${why}</p>
${isle?`<div class="newst"><span>${isle.e}</span>Đã mở đảo mới: ${isle.en}!</div>`:left.length?`<div class="newst">Để mở đảo tiếp theo, bé cần thêm: ${left.join(', ')}.</div>`:''}
<div class="dbtns"><button class="btn2" data-again>${k==='song'?ico.note+'Mở bài hát':ico.book+'Mở truyện'}</button><button class="go" data-home>Về đảo ›</button></div></div></div>`;
show('s-done');if(pass){sfx('win');confetti();setTimeout(()=>say(k==='song'?'Great singing!':'Great story telling!'),500)}else sfx('no')}
$('#s-done').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!Q)return;if(b.dataset.again!==undefined){const k=Q.kind;if(k==='song'){Q=null;openSong()}else if(k==='story'){Q=null;openStory()}else if(k==='review')startReview();else startQuiz(Q.sk)}else if(b.dataset.home!==undefined){exitQuiz()}});
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cs=['#ff5a4e','#ffc21a','#2f6fed','#1fa860','#8e5bdc','#ff8fc2'];for(let i=0;i<40;i++){const c=document.createElement('i');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=cs[i%cs.length];c.style.animationDelay=Math.random()*.6+'s';c.style.animationDuration=(1.8+Math.random()*1.2)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3800)}}

function openMe(){const n=total(),l=level(),nx=LV[l+1];
$('#s-me').innerHTML=`<div class="wrap"><div class="hdr"><button class="round" data-go="map" aria-label="Về bản đồ">${ico.back}</button><h2>Cú Tô của bé<small>Thu thập sao và sticker</small></h2></div>
<div class="me"><div class="mecard">${owl(l)}<h3>${LVN[l]}</h3>${nx!==undefined?`<p class="mute">Còn <b>${nx-n}</b> sao nữa để Cú Tô có ${GIFT[l]}</p><div class="bar"><i style="width:${Math.round((n-LV[l])/(nx-LV[l])*100)}%"></i></div>`:'<p class="mute">Cú Tô đã là vua của cả quần đảo!</p>'}<p class="bigsum">${ico.star}${n} / ${T.length*12} sao</p></div>
<div class="stk"><h3>Sticker ${S.stickers.length}/${STICK.length}</h3><p class="mute">Được 3 sao ở một trạm lần đầu là nhận 1 sticker mới.</p><div class="sgrid">${STICK.map(s=>S.stickers.includes(s)?`<span>${s}</span>`:'<span class="no">?</span>').join('')}</div></div></div></div>`;show('s-me')}

let holdT;
function openParent(){$('#s-parent').innerHTML=`<div class="gate"><div class="gcard"><h3>Dành cho ba mẹ</h3><p class="mute">Nhấn giữ nút 3 giây để vào.</p><button class="hold" id="hold"><svg class="ring" viewBox="0 0 140 140"><circle cx="70" cy="70" r="64"/></svg>Giữ</button><button class="btn2" data-go="map">Quay lại</button></div></div>`;show('s-parent');
const h=$('#hold'),stop=()=>{clearTimeout(holdT);h.classList.remove('go2')};
h.addEventListener('pointerdown',e=>{e.preventDefault();h.classList.add('go2');holdT=setTimeout(renderParent,3000)});['pointerup','pointerleave','pointercancel'].forEach(ev=>h.addEventListener(ev,stop));h.addEventListener('contextmenu',e=>e.preventDefault())}
function segB(key,opts){return `<span class="seg">${opts.map(([v,l])=>`<button class="${S.set[key]===v?'on':''}" data-set="${key}" data-v="${v}">${l}</button>`).join('')}</span>`}
function renderParent(){const ks=['L','S','R','W'],tot=ks.reduce((a,k)=>a+S.log[k].t,0);
const wk=Object.entries(S.weak).filter(([k])=>ALL[k]).sort((a,b)=>b[1]-a[1]).slice(0,12);const sm=speakMode();
$('#s-parent').innerHTML=`<div class="wrap"><div class="hdr"><button class="round" data-go="map" aria-label="Về bản đồ">${ico.back}</button><h2>Dành cho ba mẹ<small>Theo dõi và cài đặt</small></h2></div><div class="pgrid">
<div class="pc"><h3>Kết quả theo kỹ năng</h3><p class="mute">${tot?`Tỉ lệ câu bé làm đúng ngay lần đầu, trên ${tot} câu đã chơi.`:'Bé chưa chơi câu nào. Số liệu sẽ hiện ở đây.'}</p>
${ks.map(k=>{const g=S.log[k],p=g.t?Math.round(g.c/g.t*100):0;return `<div class="srow"><b>${SK[k].vi}</b><div class="bar"><i style="width:${p}%;background:var(--${k})"></i></div><em>${g.t?p+'%':'–'}</em></div>`}).join('')}</div>
<div class="pc"><h3>Từ bé hay sai</h3><p class="mute">Các từ này sẽ quay lại ở nút “Ôn tập” trên bản đồ.</p>${wk.length?`<div class="chips">${wk.map(([k,n])=>`<span class="chip">${ALL[k].w} · ${ALL[k].vi} <b>×${n}</b></span>`).join('')}</div>`:'<p>Chưa có từ nào. Giỏi lắm!</p>'}</div>
<div class="pc"><h3>Sao từng đảo</h3><table><thead><tr><th>Đảo</th>${ks.map(k=>`<th>${SK[k].vi}</th>`).join('')}<th>Hát</th><th>Truyện</th></tr></thead><tbody>${T.map(t=>`<tr><td>${t.e} ${t.en}</td>${ks.map(k=>{const v=st(t.id,k);return `<td class="s">${'★'.repeat(v)}<span style="color:#d6e3e8">${'★'.repeat(3-v)}</span></td>`}).join('')}<td>${S.song[t.id]?'✓':'–'}</td><td>${S.story[t.id]?'✓':'–'}</td></tr>`).join('')}</tbody></table></div>
<div class="pc"><h3>Cài đặt</h3>
<div class="setr"><p>Tên bé</p><input class="txt" id="pname" style="max-width:220px" maxlength="20" value="${esc(S.name)}" placeholder="Tên của bé"></div>
<div class="setr"><p>Tốc độ đọc tiếng Anh</p>${segB('rate',[[.65,'Chậm'],[.8,'Vừa'],[.95,'Nhanh']])}</div>
<div class="setr"><p>Đọc hướng dẫn tiếng Việt<small>${hasVi()?'Máy có giọng tiếng Việt':'Máy này chưa có giọng tiếng Việt'}</small></p>${segB('vi',[[true,'Bật'],[false,'Tắt']])}</div>
<div class="setr"><p>Chấm phần Nói<small>${micOK()?'Micro tự chấm cần mạng và quyền dùng micro':'Ở chế độ mở này trình duyệt không cho dùng micro'}</small></p><span class="seg"><button class="${sm==='auto'?'on':''}" data-set="speak" data-v="auto">Micro tự chấm</button><button class="${sm==='parent'?'on':''}" data-set="speak" data-v="parent">Ba mẹ chấm</button></span></div>
<div class="setr"><p>Phải thuộc bài hát và truyện mới mở đảo mới<small>Ba mẹ nhấn giữ 3 giây để xác nhận bé đã thuộc</small></p>${segB('need',[[true,'Bật'],[false,'Tắt']])}</div>
<div class="setr"><p>Tốc độ nhạc bài hát</p>${segB('tempo',[[.8,'Chậm'],[1,'Vừa']])}</div>
<div class="setr"><p>Mở khóa tất cả các đảo<small>Để bé chơi theo bài đang học trên lớp</small></p>${segB('all',[[true,'Bật'],[false,'Tắt']])}</div>
<div class="setr"><button class="small" data-test>${ico.spk}Thử giọng đọc</button><button class="danger" data-reset>Xóa toàn bộ tiến trình</button></div></div>
</div></div>`;
$('#pname').addEventListener('input',e=>{S.name=e.target.value.trim().slice(0,20);save()})}
$('#s-parent').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.set){const v=d.v==='true'?true:d.v==='false'?false:isNaN(+d.v)?d.v:+d.v;S.set[d.set]=v;save();renderParent();if(d.set==='rate')say('This is my school bag.');return}
if(d.test!==undefined){say('Hello! Let us learn English.').then(()=>{if(hasVi())say('Xin chào, mình là Cú Tô.','vi')});return}
if(d.reset!==undefined)modal(`<h3>Xóa tiến trình?</h3><p>Toàn bộ sao, sticker và từ cần ôn sẽ mất, không lấy lại được.</p><div class="dbtns"><button class="btn2" data-mx>Thôi</button><button class="go" data-mreset>Xóa</button></div>`)});
$('#modal').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.mx!==undefined)closeModal();
if(b.dataset.mreset!==undefined){const nm=S.name;S=fresh();S.name=nm;S.seen=true;save();closeModal();toast('Đã xóa tiến trình.');renderParent()}
if(b.id==='nmok'){S.name=($('#nm').value||'').trim().slice(0,20);S.seen=true;save();closeModal();renderTop();say("Hello! Let's play!").then(()=>{if(S.set.vi&&hasVi())say((S.name?'Chào '+S.name+'! ':'')+'Bé chọn hòn đảo đầu tiên nhé.','vi')})}});
$('#modal').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm'){e.preventDefault();$('#nmok').click()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;const g=b.dataset.go;if(g==='map')show('s-map');else if(g==='me')openMe();else if(g==='parent')openParent();else if(g==='review')startReview()});

window.__q=cq;
window.claude?.hot?.snapshot?.(()=>S);
const start=d=>{S=d&&d.log?merge(d):load();show('s-map');
if(!S.seen)modal(`${owl(0)}<h3>Chào bé! Mình là Cú Tô</h3><p class="mute">Cùng Cú Tô đi khắp quần đảo tiếng Anh nhé. Bé tên là gì?</p><input class="txt" id="nm" maxlength="20" placeholder="Tên của bé" autocomplete="off"><div class="dbtns"><button class="go" id="nmok">Bắt đầu chơi ›</button></div>`)};
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
}
</script>
</body>
</html>
